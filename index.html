<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kad Raya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Marhey:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene-wrap">
      <section id="prelude-scene" class="scene active" aria-live="polite">
        <p class="prelude-text">Kembali ke fitrah, bersatu dalam ukhuwah</p>
      </section>

      <section id="intro-scene" class="scene" aria-live="polite">
        <div class="star-layer" aria-hidden="true"></div>
        <img id="star" src="./media/staryry.png" alt="Starry sky" />
        <div class="intro-content">
          <button id="moon-button" class="moon-button" aria-label="Click crescent moon to continue">
            <img src="media/crescent.png" alt="Crescent moon" class="moon-image" />
          </button>
          <h1 class="headline">Sinar Syawal telah tiba, membawa damai di dalam jiwa.</h1>
          <p class="subline">Klik bulan sabit untuk membuka kad ucapan.</p>
        </div>
      </section>

      <section id="celebration-scene" class="scene" aria-live="polite">
        <article id="book-card" class="book-card" aria-label="Kad ucapan Hari Raya">
          <div class="book-spine" aria-hidden="true"></div>
          <div class="book-page left-page" aria-hidden="true"></div>
          <div class="book-page right-page">
            <h2>Selamat Hari Raya</h2>
            <p id="typewriter" class="typewriter"></p>
          </div>
        </article>

        <button id="song-toggle" class="song-toggle" type="button">▶ Mainkan Lagu</button>
        <button id="close-button" class="close-button" type="button">Tutup</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
